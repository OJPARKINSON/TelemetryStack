services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      - telemetry-network
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
      - traefik-logs:/var/log/traefik
      - traefik-acme:/var/lib/traefik
      - /var/run/tailscale:/var/run/tailscale:ro
    environment:
      - TRAEFIK_DASHBOARD_AUTH=${TRAEFIK_DASHBOARD_AUTH}
      - TAILSCALE_DOMAIN=${TAILSCALE_DOMAIN}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
        reservations:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/net-dash`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth,secure-dashboard@file"
      # HTTPS
      - "traefik.http.routers.dashboard-secure.rule=Host(`${TAILSCALE_DOMAIN}`) && PathPrefix(`/net-dash`)"
      - "traefik.http.routers.dashboard-secure.entrypoints=websecure"
      - "traefik.http.routers.dashboard-secure.tls.certresolver=tailscale"
      - "traefik.http.routers.dashboard-secure.service=api@internal"
      - "traefik.http.routers.dashboard-secure.middlewares=dashboard-auth,secure-dashboard@file"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "9002:9000"
      - "8812:8812"
      - "9009:9009"
      - "9003:9003"
    volumes:
      - questdb-data:/var/lib/questdb
      - ./config/questdb.conf:/root/.questdb/conf/server.conf:ro
    environment:
      JAVA_OPTS: "-Xmx12g -Xms4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      QDB_SHARED_WORKER_COUNT: "6"
      QDB_HTTP_ENABLED: "true"
      QDB_PG_ENABLED: "true"
      QDB_METRICS_ENABLED: "true"
      QDB_LINE_TCP_ENABLED: "true"
      QDB_CAIRO_WAL_ENABLED_DEFAULT: "true"
      QDB_CAIRO_COMMIT_LAG: "120000"
      QDB_CAIRO_MAX_UNCOMMITTED_ROWS: "300000"
    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 16g
        reservations:
          cpus: '2'
          memory: 4g

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.questdb.rule=PathPrefix(`/questdb`)"
      - "traefik.http.routers.questdb.entrypoints=web"
      - "traefik.http.routers.questdb.middlewares=questdb-stripprefix@file"
      # HTTPS
      - "traefik.http.routers.questdb-secure.rule=Host(`${TAILSCALE_DOMAIN}`) && PathPrefix(`/questdb`)"
      - "traefik.http.routers.questdb-secure.entrypoints=websecure"
      - "traefik.http.routers.questdb-secure.tls.certresolver=tailscale"
      - "traefik.http.routers.questdb-secure.middlewares=questdb-stripprefix@file"
      - "traefik.http.services.questdb.loadbalancer.server.port=9000"

  telemetry-service:
    image: ghcr.io/ojparkinson/iracing-telemetryservice:latest
    restart: unless-stopped
    ports:
      - "9092:9092"  # Prometheus metrics
      - "8010:8010"  # Data ingestion
    networks:
      - telemetry-network
    environment:
      QUESTDB_URL: questdb:8812;username=admin;password=quest
      QUESTDB_HOST: ${QUESTDB_HOST:-questdb}
      QUESTDB_PORT: ${QUESTDB_HTTP_PORT:-9000}
      GOMAXPROCS: "3"
      SENDER_POOL_SIZE: "4"
      QUEUE_WORKERS: "4"
    depends_on:
      questdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 768m
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.telemetry-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.telemetry-api.entrypoints=web"
      - "traefik.http.routers.telemetry-api.middlewares=api-security@file"
      # HTTPS
      - "traefik.http.routers.telemetry-api-secure.rule=Host(`${TAILSCALE_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.telemetry-api-secure.entrypoints=websecure"
      - "traefik.http.routers.telemetry-api-secure.tls.certresolver=tailscale"
      - "traefik.http.routers.telemetry-api-secure.middlewares=api-security@file"
      - "traefik.http.services.telemetry-service.loadbalancer.server.port=8010"

  telemetry-dashboard:
    image: ghcr.io/ojparkinson/iracing-display:latest
    restart: unless-stopped
    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.telemetry-dashboard.rule=PathPrefix(`/dashboard`)"
      - "traefik.http.routers.telemetry-dashboard.entrypoints=web"
      # HTTPS
      - "traefik.http.routers.telemetry-dashboard-secure.rule=Host(`${TAILSCALE_DOMAIN}`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.telemetry-dashboard-secure.entrypoints=websecure"
      - "traefik.http.routers.telemetry-dashboard-secure.tls.certresolver=tailscale"
      - "traefik.http.services.telemetry-dashboard.loadbalancer.server.port=8080"

  grafana:
    image: dhi.io/grafana:12.3
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    environment:
      # Grafana settings optimized for high performance
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_INSTALL_PLUGINS: grafana-clock-panel
      GF_PROVISIONING_AUTO_ASSIGN_ORG: "true"
      GF_PROVISIONING_AUTO_ASSIGN_ORG_ROLE: Admin

      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/files/system-monitoring.json
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5g
        reservations:
          cpus: '0.25'
          memory: 256m
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.middlewares=secure-management@file"
      # HTTPS
      - "traefik.http.routers.grafana-secure.rule=Host(`${TAILSCALE_DOMAIN}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana-secure.entrypoints=websecure"
      - "traefik.http.routers.grafana-secure.tls.certresolver=tailscale"
      - "traefik.http.routers.grafana-secure.middlewares=secure-management@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://localhost/prometheus'
      - '--web.route-prefix=/'
      - '--storage.tsdb.retention.size=2GB'
    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
        reservations:
          cpus: '0.25'
          memory: 512m
    labels:
      - "traefik.enable=true"
      # HTTP
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.middlewares=prometheus-stripprefix@file,secure-management@file"
      # HTTPS
      - "traefik.http.routers.prometheus-secure.rule=Host(`${TAILSCALE_DOMAIN}`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus-secure.entrypoints=websecure"
      - "traefik.http.routers.prometheus-secure.tls.certresolver=tailscale"
      - "traefik.http.routers.prometheus-secure.middlewares=prometheus-stripprefix@file,secure-management@file"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # Simplified monitoring stack
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - telemetry-network
    deploy:
      resources:
        limits:
          cpus: 0.3
          memory: 256m

  # Optional: Watchtower for auto-updates (can be disabled)
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup --label-enable
    environment:
      TZ: Europe/London
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 256m

volumes:
  questdb-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  traefik-logs:
    driver: local
  traefik-acme:
    driver: local

networks:
  telemetry-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
