# QuestDB Configuration File
# Optimized for telemetry ingestion

# =============================================================================
# HTTP Interface
# =============================================================================
http.enabled=true
http.bind.to=0.0.0.0:9000
http.connection.pool.initial.capacity=8
http.send.buffer.size=1048576

# =============================================================================
# PostgreSQL Wire Protocol (Dashboard reads)
# =============================================================================
pg.enabled=true
pg.net.bind.to=0.0.0.0:8812
pg.net.connection.limit=16
pg.password=quest
pg.user=admin
pg.select.cache.enabled=true
pg.insert.cache.enabled=true

# =============================================================================
# InfluxDB Line Protocol over HTTP (used by LineSender)
# =============================================================================
line.http.enabled=true

# InfluxDB Line Protocol over TCP (optional)
line.tcp.enabled=true
line.tcp.net.bind.to=0.0.0.0:9009

# =============================================================================
# Storage & Performance
# =============================================================================
cairo.wal.enabled.default=true

# WAL tuning
cairo.wal.segment.rollover.row.count=50000
cairo.wal.apply.table.time.quota=30000

# Workers — matches container cpus limit (4). Per QuestDB docs, default for
# <=16 cores is max(2, CPU count). Eight workers on a 4-core container caused
# context-switch contention during concurrent ingest+query.
shared.worker.count=4

# Metrics
metrics.enabled=true
